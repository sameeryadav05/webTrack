services:
  webtrack_rabbitmq:
    image: rabbitmq:management
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=sameer_2005
    ports:
      - 15672:15672
      - 5672:5672
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  webtrack_redis:
    image: redis/redis-stack-server:latest
    ports:
      - 6379:6379
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass sameer_2005
    volumes:
      - redis_data:/data

  webtrack_backend:
    build: ./analytics-tracker
    ports:
      - 5000:5000
    env_file:
      - ./analytics-tracker/.env
    depends_on:
      - Rabbitmq
      - Redis
    command: ["npm", "start"]
    restart: unless-stopped

  webtrack_frontend:
    build: ./Client
    ports:
      - 3000:80

volumes:
  redis_data:
  rabbitmq_data: